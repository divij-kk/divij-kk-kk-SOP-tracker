<style>

<script>
"use strict";
/* =========================================================================
   Utilities
   ========================================================================= */
const CFG = window.KK_CONFIG;
const DEMO = !CFG.SUPABASE_URL || new URLSearchParams(location.search).has("demo");
const TZ = "Asia/Kolkata";
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

const istToday = () => new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(new Date());
const toD = (s) => new Date(s + "T00:00:00Z");
const fromD = (d) => d.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = toD(s); d.setUTCDate(d.getUTCDate() + n); return fromD(d); };
const diffDays = (a, b) => Math.round((toD(a) - toD(b)) / 86400000);
const dow = (s) => toD(s).getUTCDay();
const fmtDate = (s, opts = { weekday: "short", day: "numeric", month: "short" }) => toD(s).toLocaleDateString("en-IN", { ...opts, timeZone: "UTC" });
const fmtTime = (iso) => iso ? new Date(iso).toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit", timeZone: TZ }) : "";
const istDateOf = (iso) => new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(new Date(iso));
const istHHMM = (iso) => new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: TZ }).format(new Date(iso));
const isoAtIST = (date, hhmm) => new Date(`${date}T${hhmm}:00+05:30`).toISOString();
const fmtHHMM = (t) => { if (!t) return ""; const [h, m] = t.split(":").map(Number); const ap = h >= 12 ? "pm" : "am"; return `${((h + 11) % 12) + 1}:${String(m).padStart(2, "0")} ${ap}`; };
const pct = (a, b) => (b ? Math.round((a / b) * 100) : null);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
const slugEmail = (name) => name.toLowerCase().trim().replace(/[^a-z0-9]+/g, ".").replace(/^\.|\.$/g, "") + "@" + CFG.MANAGER_EMAIL_DOMAIN;
const titleCase = (s) => s.toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase());

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

/* =========================================================================
   Scheduling — which tasks fall on which day
   ========================================================================= */
const ONE_OFF = (t) => t.task_type === "adhoc" || t.task_type === "project";
const weekStart = (s) => addDays(s, -dow(s));
const monthsBetween = (a, b) => { const A = toD(a), B = toD(b); return (B.getUTCFullYear() - A.getUTCFullYear()) * 12 + (B.getUTCMonth() - A.getUTCMonth()); };

function isRecurringDue(t, d) {
  if (ONE_OFF(t) || !t.active) return false;
  if (d < t.start_date) return false;
  if (t.end_date && d > t.end_date) return false;
  if (t.task_type === "daily") return true;
  const every = t.repeat_every || 1, days = t.repeat_days || [];
  if (t.repeat_unit === "weekly") {
    if (!days.includes(dow(d))) return false;
    return (diffDays(weekStart(d), weekStart(t.start_date)) / 7) % every === 0;
  }
  if (t.repeat_unit === "monthly") {
    const D = toD(d), day = D.getUTCDate();
    const last = new Date(Date.UTC(D.getUTCFullYear(), D.getUTCMonth() + 1, 0)).getUTCDate();
    if (!days.some((x) => Math.min(x, last) === day)) return false;
    return monthsBetween(t.start_date, d) % every === 0;
  }
  return false;
}

/* For one manager on one date: what was due, what was done.
   comps: Map key `${task_id}|${date}` → completion; oneOffDone: Map task_id → completion */
function dayPlan(tasks, compIndex, oneOffDone, d) {
  const items = [];
  for (const t of tasks) {
    if (ONE_OFF(t)) {
      if (!t.active && !oneOffDone.has(t.id)) continue;
      const c = oneOffDone.get(t.id);
      const doneOn = c ? c.for_date : null;
      if (doneOn === d) items.push({ t, c, kind: "oneoff" });
      else if (!c && t.start_date <= d && t.due_date <= d) items.push({ t, c: null, kind: "oneoff", overdue: t.due_date < d });
      else if (c && doneOn > d && t.due_date <= d) items.push({ t, c: null, kind: "oneoff", overdue: t.due_date < d });
    } else if (isRecurringDue(t, d)) {
      items.push({ t, c: compIndex.get(`${t.id}|${d}`) || null, kind: "rec" });
    }
  }
  return items;
}
function indexComps(comps, tasks) {
  const byKey = new Map(), oneOff = new Map();
  const oneOffIds = new Set(tasks.filter(ONE_OFF).map((t) => t.id));
  for (const c of comps) {
    byKey.set(`${c.task_id}|${c.for_date}`, c);
    if (oneOffIds.has(c.task_id)) { const p = oneOff.get(c.task_id); if (!p || c.for_date < p.for_date) oneOff.set(c.task_id, c); }
  }
  return { byKey, oneOff };
}
const isLate = (c) => c && istDateOf(c.created_at) > c.for_date;

/* =========================================================================
   Backend: Supabase (live) or in-memory (demo)
   ========================================================================= */
function supabaseApi() {
  const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  const ok = ({ data, error }) => { if (error) throw new Error(error.message); return data; };
  async function all(q) { // page past Supabase's 1000-row cap
    const out = []; for (let from = 0; ; from += 1000) { const rows = ok(await q().range(from, from + 999)); out.push(...rows); if (rows.length < 1000) return out; }
  }
  return {
    async listManagers() { return ok(await sb.rpc("list_managers")); },
    async signIn(email, password) {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw new Error(/invalid/i.test(error.message) ? "Wrong PIN or password. Try again." : error.message);
      return this.me();
    },
    async me() {
      const { data } = await sb.auth.getSession(); if (!data.session) return null;
      const p = ok(await sb.from("profiles").select("*").eq("id", data.session.user.id).maybeSingle());
      if (!p || !p.active) { await sb.auth.signOut(); return null; }
      return p;
    },
    async signOut() { await sb.auth.signOut(); },
    async profiles() { return ok(await sb.from("profiles").select("*").order("full_name")); },
    async tasks(managerId) { return all(() => { let q = sb.from("tasks").select("*").order("sort_order").order("created_at"); if (managerId) q = q.eq("manager_id", managerId); return q; }); },
    async completions({ managerId, from, to, taskIds }) {
      return all(() => {
        let q = sb.from("task_completions").select("*").order("for_date");
        if (managerId) q = q.eq("manager_id", managerId);
        if (taskIds) q = q.in("task_id", taskIds); else q = q.gte("for_date", from).lte("for_date", to);
        return q;
      });
    },
    async oneOffCompletions(ids) { if (!ids.length) return []; return this.completions({ taskIds: ids }); },
    async saveCompletion(c) { return ok(await sb.from("task_completions").upsert(c, { onConflict: "task_id,for_date" }).select().single()); },
    async deleteCompletion(id) { ok(await sb.from("task_completions").delete().eq("id", id)); },
    async saveTasks(rows) { return ok(await sb.from("tasks").upsert(rows).select()); },
    async deleteTask(id) { ok(await sb.from("tasks").delete().eq("id", id)); },
    async deleteTasks(ids) { for (let i = 0; i < ids.length; i += 100) ok(await sb.from("tasks").delete().in("id", ids.slice(i, i + 100))); },
    async syncTasks(sheet, apply) {
      const { data, error } = await sb.rpc("admin_sync_tasks", { p_sheet: sheet, p_apply: apply });
      if (error) throw new Error(/admin_sync_tasks/.test(error.message) ? "Excel import isn't set up yet. Run sheet-sync.sql in Supabase first." : error.message);
      return data;
    },
    async photos({ managerId, from, to }) {
      let q = sb.from("unit_photos").select("*").gte("for_date", from).lte("for_date", to).order("created_at");
      if (managerId) q = q.eq("manager_id", managerId);
      const rows = ok(await q); if (!rows.length) return rows;
      const signed = ok(await sb.storage.from("unit-photos").createSignedUrls(rows.map((r) => r.storage_path), 3600));
      const m = new Map(signed.map((s) => [s.path, s.signedUrl]));
      return rows.map((r) => ({ ...r, url: m.get(r.storage_path) }));
    },
    async uploadPhoto(managerId, date, blob, caption) {
      const path = `${managerId}/${date}/${uid()}.jpg`;
      ok(await sb.storage.from("unit-photos").upload(path, blob, { contentType: "image/jpeg" }));
      return ok(await sb.from("unit_photos").insert({ manager_id: managerId, for_date: date, storage_path: path, caption }).select().single());
    },
    async deletePhoto(p) { await sb.storage.from("unit-photos").remove([p.storage_path]); ok(await sb.from("unit_photos").delete().eq("id", p.id)); },
    async updateProfile(id, patch) { ok(await sb.from("profiles").update(patch).eq("id", id)); },
    async manageManager(body) {
      if (body.action === "create") ok(await sb.rpc("admin_create_manager", { p_full_name: body.full_name, p_department: body.department, p_email: body.email, p_pin: body.pin }));
      else if (body.action === "reset_pin") ok(await sb.rpc("admin_reset_pin", { p_user_id: body.user_id, p_pin: body.pin }));
      else if (body.action === "set_active") ok(await sb.rpc("admin_set_active", { p_user_id: body.user_id, p_active: body.active }));
      else throw new Error("Unknown action.");
      return { ok: true };
    },
  };
}

function brandMark(size = 40) {

/* Canopy: one panel per task; filled panels = done. Above 16 tasks, panels show proportionally. */
function canopySVG(done, total) {
  const N = Math.max(1, Math.min(total || 8, 16));
  const filled = total ? (total <= 16 ? done : Math.round((done / total) * 16)) : 0;
  const W = 200, cx = 100, top = 10, base = 92, half = 92, sc = 9;
  const xs = Array.from({ length: N + 1 }, (_, i) => cx - half + (2 * half * i) / N);
  const ribPath = (x) => `Q ${x.toFixed(1)} ${top + 8} ${x.toFixed(1)} ${base}`;
  const ribRev = (x) => `Q ${x.toFixed(1)} ${top + 8} ${cx} ${top}`;
  let panels = "", ribs = "";
  for (let i = 0; i < N; i++) {
    const a = xs[i], b = xs[i + 1], mid = (a + b) / 2;
    panels += `<path class="p ${i < filled ? "p-on" : "p-off"}" d="M ${cx} ${top} ${ribPath(a)} Q ${mid.toFixed(1)} ${base - sc} ${b.toFixed(1)} ${base} ${ribRev(b)} Z"/>`;
    if (i > 0) ribs += `<path class="rib" fill="none" d="M ${cx} ${top} ${ribPath(a)}"/>`;
  }
  return `<svg class="canopy" viewBox="0 0 ${W} 150" role="img" aria-label="${done} of ${total} tasks done">${panels}${ribs}<path class="shaft" d="M ${cx} ${top - 6} V ${top}"/><path class="shaft" d="M ${cx} ${base - 4} V 132 Q ${cx} 144 ${cx - 11} 144 Q ${cx - 20} 144 ${cx - 20} 135"/></svg>`;
}

function typeChip(t) {
  if (t.task_type === "daily") return "";
  if (t.task_type === "recurring") {
    const days = t.repeat_unit === "weekly" ? t.repeat_days.map((x) => DOW[x]).join(", ") : t.repeat_days.map((x) => (x >= 31 ? "last day" : ordinal(x))).join(", ");
    const ev = t.repeat_every > 1 ? `every ${t.repeat_every} ${t.repeat_unit === "weekly" ? "weeks" : "months"}` : t.repeat_unit === "weekly" ? "weekly" : "monthly";
    return `<span class="chip">${esc(ev)} · ${esc(days)}</span>`;
  }
  if (t.task_type === "project") return `<span class="chip teal">Project: ${esc(t.project_name || "—")}</span>`;
  return `<span class="chip">One-off</span>`;
}
const ordinal = (n) => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");

function taskRowHTML({ t, c, overdue, upcoming }) {
  const meta = [];
  if (c) {
    meta.push(`<span class="chip teal">Done ${esc(fmtTime(c.completed_at))}</span>`);
    if (c.entry_mode === "manual") meta.push(`<span class="chip">Time entered</span>`);
    if (isLate(c)) meta.push(`<span class="chip amber">Entered late</span>`);
  } else {
    if (overdue) meta.push(`<span class="chip red">Was due ${esc(fmtDate(t.due_date, { day: "numeric", month: "short" }))}</span>`);
    if (upcoming) meta.push(`<span class="chip">Due ${esc(fmtDate(t.due_date))}</span>`);
    if (t.target_time) meta.push(`<span class="chip">By ${esc(fmtHHMM(t.target_time))}</span>`);
  }
  if (t.priority === "high" && !c) meta.push(`<span class="chip amber">Important</span>`);
  const tc = typeChip(t); if (tc) meta.push(tc);
  return `<button type="button" class="task ${c ? "done" : ""}" data-task="${esc(t.id)}">
    <span class="tick" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="t-body"><span class="t-title">${esc(t.title)}</span>
      ${t.description ? `<span class="t-desc" style="display:block">${esc(t.description)}</span>` : ""}
      ${meta.length ? `<span class="t-meta">${meta.join("")}</span>` : ""}
      ${c && c.note ? `<span class="t-desc" style="display:block">Note: ${esc(c.note)}</span>` : ""}
    </span></button>`;
}

function taskSheet(taskId) {
  const t = S.mTasks.find((x) => x.id === taskId); if (!t) return;
  const d = S.mDate, today = istToday(), isToday = d === today;
  const { byKey, oneOff } = mIndex();
  const c = ONE_OFF(t) ? (oneOff.get(t.id) && oneOff.get(t.id).for_date === d ? oneOff.get(t.id) : null) : byKey.get(`${t.id}|${d}`);
  const nowHHMM = istHHMM(new Date().toISOString());
  openSheet(`
    <h2>${esc(t.title)}</h2>
    ${t.description ? `<p class="muted" style="margin-bottom:8px">${esc(t.description)}</p>` : ""}
    <p class="faint small" style="margin-bottom:14px">${esc(fmtDate(d, { weekday: "long", day: "numeric", month: "long" }))}${t.target_time ? " · should be done by " + esc(fmtHHMM(t.target_time)) : ""}</p>
    ${c ? `<p style="margin-bottom:12px">Marked done at <b>${esc(fmtTime(c.completed_at))}</b>${c.entry_mode === "manual" ? " (time entered)" : ""}.</p>` : ""}
    ${isToday && !c ? `<button class="btn primary block" type="button" id="doneNow">Done now</button>
      <p class="faint small" style="text-align:center;margin:12px 0">or, if it was finished earlier, enter the time</p>` : ""}
    <div class="form-grid">
      <div><label class="f" for="tm">Time it was done</label><input id="tm" class="in" type="time" value="${c ? istHHMM(c.completed_at) : (isToday ? "" : "")}" ${isToday ? `max="${nowHHMM}"` : ""}></div>
      <div class="full"><label class="f" for="nt">Note (optional)</label><input id="nt" class="in" type="text" maxlength="200" value="${esc(c ? c.note || "" : "")}" placeholder="Anything the admin should know"></div>
    </div>
    <p class="err" id="sErr"></p>
    <div class="actions">
      ${c ? `<button class="btn danger" type="button" id="undo">Mark not done</button>` : ""}
      <button class="btn" type="button" data-dismiss>Cancel</button>
      <button class="btn ${isToday && !c ? "" : "primary"}" type="button" id="saveTime">${c ? "Save changes" : "Save with this time"}</button>
    </div>`);
  const save = async (mode) => {
    const note = $("#nt").value.trim() || null;
    let completed_at;
    if (mode === "tick") completed_at = new Date().toISOString();
    else {
      const v = $("#tm").value; if (!v) { $("#sErr").textContent = "Enter the time the task was done."; return; }
      if (isToday && v > nowHHMM) { $("#sErr").textContent = "That time hasn't come yet today."; return; }
      completed_at = isoAtIST(d, v);
    }
    try {
      const row = await api.saveCompletion({ task_id: t.id, manager_id: S.me.id, for_date: d, completed_at, entry_mode: mode === "tick" ? "tick" : (c && c.entry_mode === "tick" && $("#tm").value === istHHMM(c.completed_at) ? "tick" : "manual"), note });
      S.mComps = S.mComps.filter((x) => !(x.task_id === row.task_id && x.for_date === row.for_date)).concat(row);
      if (ONE_OFF(t)) S.mOneOff = S.mOneOff.filter((x) => x.task_id !== t.id).concat(row);
      closeSheet(); renderManager(); toast("Saved");
    } catch (e) { $("#sErr").textContent = e.message; }
  };
  $("#doneNow") && ($("#doneNow").onclick = () => save("tick"));
  $("#saveTime").onclick = () => save("manual");
  $("#undo") && ($("#undo").onclick = async () => {
    try { await api.deleteCompletion(c.id); S.mComps = S.mComps.filter((x) => x.id !== c.id); S.mOneOff = S.mOneOff.filter((x) => x.id !== c.id); closeSheet(); renderManager(); toast("Marked not done"); }
    catch (e) { $("#sErr").textContent = e.message; }
  });
}

function managerPhotosHTML() {

    <label class="camera-btn" for="cam">

function bindManagerPhotos() {
  $("#cam").onchange = async (e) => {
    const files = [...e.target.files]; if (!files.length) return;
    const lbl = $(".camera-btn"); lbl.style.opacity = .6; lbl.lastChild.textContent = " Uploading…";
    try {
      for (const f of files) { const blob = await shrinkImage(f); const row = await api.uploadPhoto(S.me.id, istToday(), blob, null); if (!row.url) row.url = URL.createObjectURL(blob); S.mPhotos.push(row); }
      toast(files.length > 1 ? "Photos uploaded" : "Photo uploaded"); renderManager();
    } catch (er) { $("#phErr").textContent = "Upload failed: " + er.message; lbl.style.opacity = 1; }
  };
  app.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
    if (!(await ask("Delete this photo?", "Delete photo"))) return;
    const p = S.mPhotos.find((x) => x.id === b.dataset.del);
    try { await api.deletePhoto(p); S.mPhotos = S.mPhotos.filter((x) => x !== p); renderManager(); } catch (e) { toast(e.message); }
  });
}
function shrinkImage(file, max = 1400) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob((b) => (b ? resolve(b) : reject(new Error("Could not read the photo"))), "image/jpeg", 0.8);
    };
    img.onerror = () => reject(new Error("Could not read the photo"));
    img.src = url;
  });
}

const managers = () => S.profiles.filter((p) => p.role === "manager");
async function loadAdmin() {
  const to = istToday(), from = addDays(to, -31);
  const [profiles, tasks] = await Promise.all([api.profiles(), api.tasks()]);
  S.profiles = profiles; S.tasks = tasks;
  const oneIds = tasks.filter(ONE_OFF).map((t) => t.id);
  const [comps, one] = await Promise.all([api.completions({ from: addDays(from, -31), to }), api.oneOffCompletions(oneIds)]);
  S.comps = comps; S.oneOff = one;
  await loadAdminPhotos();
}
async function loadAdminPhotos() { S.aPhotos = await api.photos({ from: addDays(S.aPhotoDate, -0), to: S.aPhotoDate }); }

function adminIndex() {
  const seen = new Set(S.comps.map((c) => c.id));
  return indexComps([...S.comps, ...S.oneOff.filter((c) => !seen.has(c.id))], S.tasks);
}
function statsFor(mid, d, idx) {
  const items = dayPlan(S.tasks.filter((t) => t.manager_id === mid), idx.byKey, idx.oneOff, d);
  const done = items.filter((x) => x.c);
  return { items, total: items.length, done: done.length, late: done.filter((x) => isLate(x.c)).length, manual: done.filter((x) => x.c.entry_mode === "manual").length };
}
function rangeStats(mid, endDate, days, idx) {
  let t = 0, d = 0, late = 0; const perDay = [];
  for (let i = days - 1; i >= 0; i--) { const day = addDays(endDate, -i); const s = statsFor(mid, day, idx); t += s.total; d += s.done; late += s.late; perDay.push({ day, ...s }); }
  return { total: t, done: d, late, rate: pct(d, t), perDay };
}
function meter(done, total) {
  const p = pct(done, total);
  if (p === null) return `<span class="faint small">No tasks</span>`;
  return `<div class="meter"><div class="track"><div class="fill ${p < 50 ? "low" : p < 80 ? "mid" : ""}" style="width:${p}%"></div></div><span>${done}/${total}</span></div>`;
}

      <div class="card kpi"><div class="v">${photosShown ? photoSet.size : "–"}<span class="faint" style="font-size:1rem"> / ${rows.length}</span></div><div class="l">units photographed</div></div>

/* ---------- Delete one task ---------- */
async function deleteTaskFlow(t, onCancel) {
  if (!t) return;
  const m = S.profiles.find((p) => p.id === t.manager_id);
  const who = m ? titleCase(m.full_name) : "the manager";
  if (!(await ask(`Delete “${t.title}” from ${who}'s tasks? It disappears from their list, and its past ticks are deleted too.${t.source === "sheet" ? " It is in the Google Sheet, so the next sync adds it back. Remove it from the sheet instead." : ""}`, "Delete task"))) { if (onCancel) onCancel(); return; }
  try {
    await api.deleteTask(t.id);
    S.tasks = S.tasks.filter((x) => x.id !== t.id);
    S.comps = S.comps.filter((c) => c.task_id !== t.id);
    S.oneOff = S.oneOff.filter((c) => c.task_id !== t.id);
    renderAdmin(); toast("Task deleted");
  } catch (e) { toast(e.message); }
}

/* ---------- Excel: same layout and same rules as the Google Sheet sync ----------
   Row 1 = manager names (one name over two columns), row 2 = DAILY REPETITIVE / NON-DAILY,
   row 3+ = tasks. Without row 2, every task is treated as daily. */
const XL_SHEET = "TASK LISTS";
const normText = (v) => String(v ?? "").replace(/\s+/g, " ").trim();
const nameKey = (v) => normText(v).toUpperCase();
const byOrder = (a, b) => (a.sort_order - b.sort_order) || String(a.created_at || "").localeCompare(String(b.created_at || ""));
function xlReady() { if (window.XLSX) return true; toast("Excel tools didn't load. Check the internet connection and reload the page."); return false; }

/* Keep identical to kkParseTaskSheet in google-apps-script/Code.gs */
function parseTaskSheet(rows) {
  const head = rows[0] || [], sub = rows[1] || [];
  const hasSub = sub.some((v) => /DAILY/i.test(normText(v)));
  const start = hasSub ? 2 : 1;
  const width = rows.reduce((w, r) => Math.max(w, (r || []).length), 0);
  const byName = new Map();
  let owner = null;
  for (let c = 0; c < width; c++) {
    const name = normText(head[c]);
    if (name) {
      const key = name.toUpperCase();
      if (!byName.has(key)) byName.set(key, { manager: name, daily: [], nondaily: [] });
      owner = byName.get(key);
    }
    if (!owner) continue;
    if (hasSub ? !normText(sub[c]) : !name) continue;
    const kind = hasSub && /NON/i.test(normText(sub[c])) ? "nondaily" : "daily";
    for (let r = start; r < rows.length; r++) { const t = normText((rows[r] || [])[c]); if (t) owner[kind].push(t); }
  }
  return [...byName.values()];
}

function exportTasksExcel() {
  if (!xlReady()) return;
  const mgrs = managers().filter((m) => m.active).sort((a, b) => a.full_name.localeCompare(b.full_name));
  const head = [], sub = [], cols = [], merges = [];
  mgrs.forEach((m, i) => {
    const mine = S.tasks.filter((t) => t.manager_id === m.id).sort(byOrder);
    const daily = mine.filter((t) => t.active && t.task_type === "daily" && !t.needs_schedule).map((t) => t.title);
    const other = mine.filter((t) => t.needs_schedule || (t.active && t.task_type !== "daily")).map((t) => t.title);
    head.push(m.full_name, ""); sub.push("DAILY REPETITIVE", "NON-DAILY"); cols.push(daily, other);
    merges.push({ s: { r: 0, c: 2 * i }, e: { r: 0, c: 2 * i + 1 } });
  });
  const height = cols.reduce((h, c) => Math.max(h, c.length), 0);
  const aoa = [head, sub];
  for (let r = 0; r < height; r++) aoa.push(cols.map((c) => c[r] ?? ""));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = cols.map(() => ({ wch: 30 }));
  ws["!merges"] = merges;
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, XL_SHEET);
  XLSX.writeFile(wb, `SOP - FACTORY tasks ${istToday()}.xlsx`);
  toast("Excel exported");
}

async function importTasksExcel(file) {
  if (!xlReady()) return;
  let sheet;
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const name = wb.SheetNames.find((n) => nameKey(n) === XL_SHEET);
    if (!name) { toast(`This file has no sheet named “${XL_SHEET}”. Sheets found: ${wb.SheetNames.join(", ")}`); return; }
    sheet = parseTaskSheet(XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: "", raw: false, blankrows: true }));
  } catch (e) { toast("Couldn't read that file. Save it as .xlsx and try again."); return; }
  if (!sheet.length) { toast("No manager names found in row 1 of the TASK LISTS sheet."); return; }
  let res;
  try { res = await api.syncTasks(sheet, false); } catch (e) { toast(e.message); return; }
  const n = res.totals || {};
  const any = n.added || n.removed || n.restored || n.needs_schedule || n.made_daily;
  const li = (arr, cls, chip) => (arr || []).map((t) => `<li class="${cls}">${esc(t)}${chip ? `<span class="chip ${chip[1]}">${chip[0]}</span>` : ""}</li>`).join("");
  const changed = (res.managers || []).filter((m) => m.added.length || m.removed.length || m.restored.length || m.needs_schedule.length || m.made_daily.length);
  const untouched = managers().filter((m) => m.active && !(res.managers || []).some((x) => x.manager_id === m.id)).map((m) => titleCase(m.full_name));
  openSheet(`
    <h2>Import tasks from Excel</h2>
    <p class="muted" style="margin-bottom:12px">${esc(file.name)} · ${(res.managers || []).length} managers in the sheet</p>
    ${any ? `<div class="kpis" style="margin-bottom:12px">
        <div class="card kpi"><div class="v">${n.added + n.restored}</div><div class="l">daily tasks to add</div></div>
        <div class="card kpi"><div class="v">${n.removed}</div><div class="l">tasks to remove</div></div>
        ${n.needs_schedule ? `<div class="card kpi"><div class="v">${n.needs_schedule}</div><div class="l">non-daily tasks to schedule</div></div>` : ""}
      </div>` : `<p style="margin-bottom:12px"><b>Nothing to change.</b> The app already matches this sheet.</p>`}
    ${res.unknown && res.unknown.length ? `<p class="err" style="margin-bottom:10px">Names in row 1 that don't match any manager in the app (skipped): ${esc(res.unknown.join(", "))}</p>` : ""}
    ${untouched.length ? `<p class="faint small" style="margin-bottom:10px">Not in the sheet, so left unchanged: ${esc(untouched.join(", "))}</p>` : ""}
    ${changed.length ? `<div class="card table-wrap" style="max-height:46vh;overflow:auto"><table class="t">
        <thead><tr><th>Manager</th><th>Changes</th></tr></thead>
        <tbody>${changed.map((m) => `<tr><td style="vertical-align:top"><b>${esc(titleCase(m.manager))}</b><div class="faint small">${m.kept} unchanged</div></td>
          <td><ul class="xl-diff">${li(m.added, "add")}${li(m.restored, "add", ["back on", "teal"])}${li(m.made_daily, "add", ["now daily", "teal"])}${li(m.needs_schedule, "note", ["needs schedule", "amber"])}${li(m.removed, "del")}</ul></td></tr>`).join("")}</tbody>
      </table></div>` : ""}
    ${n.removed ? `<p class="faint small" style="margin-top:10px">Removed tasks are paused: they leave the manager's list, and their history is kept.</p>` : ""}
    ${n.needs_schedule ? `<p class="faint small" style="margin-top:6px">Non-daily tasks stay hidden from managers until you set when they repeat (Tasks → Edit).</p>` : ""}
    <p class="faint small" style="margin-top:6px">Tasks you created in the app (not from the sheet) are never changed by an import.</p>
    <p class="err" id="xlErr"></p>
    <div class="actions"><button class="btn" type="button" data-dismiss>${any ? "Cancel" : "Close"}</button>
      ${any ? `<button class="btn primary" type="button" id="xlApply">Apply changes</button>` : ""}</div>`, true);
  $("#xlApply") && ($("#xlApply").onclick = async () => {
    const btn = $("#xlApply"); btn.disabled = true; btn.textContent = "Updating…";
    try {
      const done = await api.syncTasks(sheet, true), t = done.totals || {};
      closeSheet(); await loadAdmin(); renderAdmin();
      toast(`Tasks updated: ${t.added + t.restored} added, ${t.removed} removed${t.needs_schedule ? `, ${t.needs_schedule} to schedule` : ""}`);
    } catch (e) { $("#xlErr").textContent = "Update stopped: " + e.message; btn.disabled = false; btn.textContent = "Apply changes"; }
  });
}

  $("#selNone").onclick = () => layer.querySelectorAll("[name=mg]").forEach((c) => c.checked = false);

function taskForm(task, preselect = []) {
  const editing = !!task, today = istToday();
  const t = task || { task_type: "daily", repeat_unit: "weekly", repeat_days: [], repeat_every: 1, priority: "normal", start_date: today };
  let type = t.needs_schedule ? "recurring" : t.task_type, unit = t.repeat_unit || "weekly", days = new Set(t.repeat_days || []);
  const draw = () => {
    openSheet(`
      <h2>${editing ? "Edit task" : "Assign a task"}</h2>
      <p class="faint small" style="margin-bottom:14px">${editing ? esc(titleCase(S.profiles.find((p) => p.id === t.manager_id)?.full_name || "")) : "Pick one or more managers. Each gets their own copy of the task."}</p>
      ${editing && t.needs_schedule ? `<p class="banner" style="margin:0 0 14px">This task is in the NON-DAILY column of the sheet. Choose when it repeats, then save. Managers see it after that.</p>` : ""}
      ${editing && t.source === "sheet" && !t.needs_schedule ? `<p class="faint small" style="margin:-8px 0 14px">This task comes from the Google Sheet. Its wording and the daily / non-daily column are set in the sheet.</p>` : ""}
      <div class="form-grid">
        <div class="full"><label class="f" for="tt">Task</label><input id="tt" class="in" value="${esc(t.title || "")}" placeholder="e.g. Update production in MIS sheet" autofocus></div>
        <div class="full"><label class="f" for="td">Details (optional)</label><textarea id="td" class="in" placeholder="Steps, standard, or what to check">${esc(t.description || "")}</textarea></div>
        <div class="full"><label class="f">Type</label><div class="seg" role="group">${Object.entries(TYPE_LABEL).map(([k, l]) => `<button type="button" data-type="${k}" aria-pressed="${type === k}">${l}</button>`).join("")}</div></div>
        ${type === "recurring" ? `
          <div><label class="f">Repeats</label><div class="seg" role="group">${["weekly", "monthly"].map((u) => `<button type="button" data-unit="${u}" aria-pressed="${unit === u}">${u === "weekly" ? "Weekly" : "Monthly"}</button>`).join("")}</div></div>
          <div><label class="f" for="ev">Every</label><select id="ev" class="in">${(unit === "weekly" ? [[1, "week"], [2, "2 weeks (fortnightly)"], [4, "4 weeks"]] : [[1, "month"], [2, "2 months"], [3, "3 months (quarterly)"], [6, "6 months"], [12, "12 months (yearly)"]]).map(([v, l]) => `<option value="${v}" ${t.repeat_every == v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
          <div class="full"><label class="f">${unit === "weekly" ? "On these days" : "On these dates"}</label><div class="days">${unit === "weekly" ? DOW.map((l, i) => `<button type="button" data-dd="${i}" aria-pressed="${days.has(i)}">${l}</button>`).join("") : Array.from({ length: 31 }, (_, i) => i + 1).map((n) => `<button type="button" data-dd="${n}" aria-pressed="${days.has(n)}">${n === 31 ? "Last" : n}</button>`).join("")}</div></div>
        ` : ""}
        ${type === "project" ? `<div class="full"><label class="f" for="pn">Project name</label><input id="pn" class="in" list="projList" value="${esc(t.project_name || "")}" placeholder="e.g. New KK website"><datalist id="projList">${[...new Set(S.tasks.map((x) => x.project_name).filter(Boolean))].map((p) => `<option value="${esc(p)}">`).join("")}</datalist></div>` : ""}
        <div><label class="f" for="sd">${ONE_OFF({ task_type: type }) ? "Show from" : "Starts on"}</label><input id="sd" class="in" type="date" value="${esc(t.start_date || today)}"></div>
        ${ONE_OFF({ task_type: type }) ? `<div><label class="f" for="dd">Due date</label><input id="dd" class="in" type="date" value="${esc(t.due_date || today)}"></div>` : `<div><label class="f" for="ed">Ends on (optional)</label><input id="ed" class="in" type="date" value="${esc(t.end_date || "")}"></div>`}
        <div><label class="f" for="tg">Should be done by (optional)</label><input id="tg" class="in" type="time" value="${esc((t.target_time || "").slice(0, 5))}"></div>
        <div><label class="f" for="pr">Priority</label><select id="pr" class="in"><option value="normal">Normal</option><option value="high" ${t.priority === "high" ? "selected" : ""}>Important</option><option value="low" ${t.priority === "low" ? "selected" : ""}>Low</option></select></div>
        ${editing ? `<div class="full"><label class="row"><input type="checkbox" id="ac" ${t.active || t.needs_schedule ? "checked" : ""}> Active (untick to pause without losing history)</label></div>` : `<div class="full">${managerChecks(preselect)}</div>`}

      <p class="err" id="tErr"></p>
      <div class="actions">
        ${editing ? `<button class="btn danger" type="button" id="delT">Delete</button>` : ""}

      if (!targets.length) return err("Pick at least one manager.");

        title: t.title.trim(), description: (t.description || "").trim() || null, task_type: type,
        repeat_unit: type === "recurring" ? unit : null, repeat_days: type === "recurring" ? [...days].sort((a, b) => a - b) : null,
        repeat_every: type === "recurring" ? t.repeat_every || 1 : 1, project_name: type === "project" ? t.project_name.trim() : null,
        priority: t.priority, target_time: t.target_time || null, start_date: t.start_date || today,
        due_date: ONE_OFF({ task_type: type }) ? t.due_date : null, end_date: !ONE_OFF({ task_type: type }) && t.end_date ? t.end_date : null,
        active: editing ? $("#ac").checked : true,
        ...(editing && "needs_schedule" in t ? { needs_schedule: false } : {}),
        ...(editing && "sheet_removed" in t && $("#ac").checked ? { sheet_removed: false } : {}),
      };
      const rows = editing ? [{ ...base, id: t.id, manager_id: t.manager_id }] : targets.map((mid) => ({ ...base, manager_id: mid, created_by: DEMO ? null : S.me.id, sort_order: S.tasks.filter((x) => x.manager_id === mid).length }));
      $("#saveT").disabled = true;
      try {
        const saved = await api.saveTasks(rows);
        saved.forEach((r) => { const i = S.tasks.findIndex((x) => x.id === r.id); if (i >= 0) S.tasks[i] = r; else S.tasks.push(r); });
        closeSheet(); renderAdmin(); toast(editing ? "Task saved" : `Task assigned to ${targets.length} ${targets.length === 1 ? "manager" : "managers"}`);
      } catch (e) { err(e.message); $("#saveT").disabled = false; }
    };
    $("#delT") && ($("#delT").onclick = () => { closeSheet(); deleteTaskFlow(t, () => taskForm(t)); });
  };
  draw();
}

function bulkForm(preselect = []) {
  openSheet(`
    <h2>Add many daily tasks at once</h2>
    <p class="muted small" style="margin-bottom:14px">One task per line. Each line becomes a daily task for every manager you tick. Add a time after a | to set “done by”, e.g. <i>Check attendance | 09:30</i>.</p>
    <label class="f" for="bl">Tasks</label>
    <textarea id="bl" class="in" style="min-height:180px" placeholder="Check worker attendance | 09:30&#10;Update production in MIS sheet | 18:30&#10;Lock store and switch off power"></textarea>
    <div style="margin-top:12px">${managerChecks(preselect)}</div>
    <p class="err" id="bErr"></p>
    <div class="actions"><button class="btn" type="button" data-dismiss>Cancel</button><button class="btn primary" type="button" id="bSave">Add tasks</button></div>`, true);
  bindChecks();
  $("#bSave").onclick = async () => {
    const lines = $("#bl").value.split("\n").map((l) => l.trim()).filter(Boolean);
    const mids = [...layer.querySelectorAll("[name=mg]:checked")].map((c) => c.value);
    if (!lines.length) return ($("#bErr").textContent = "Write at least one task.");
    if (!mids.length) return ($("#bErr").textContent = "Pick at least one manager.");
    const rows = [];
    for (const mid of mids) {
      let order = S.tasks.filter((x) => x.manager_id === mid).length;
      for (const l of lines) {
        const [title, time] = l.split("|").map((s) => s.trim());
        const tm = /^\d{1,2}:\d{2}$/.test(time || "") ? time.padStart(5, "0") : null;
        rows.push({ manager_id: mid, title, task_type: "daily", priority: "normal", target_time: tm, start_date: istToday(), repeat_every: 1, sort_order: order++, created_by: DEMO ? null : S.me.id, active: true });
      }
    }
    $("#bSave").disabled = true;
    try { const saved = await api.saveTasks(rows); S.tasks.push(...saved); closeSheet(); renderAdmin(); toast(`${saved.length} tasks added`); }
    catch (e) { $("#bErr").textContent = e.message; $("#bSave").disabled = false; }
  };
}

/* ---------- Photos admin ---------- */
function renderPhotoAdmin(main) {
  const d = S.aPhotoDate, today = istToday();
  const by = new Map(); S.aPhotos.filter((p) => p.for_date === d).forEach((p) => { if (!by.has(p.manager_id)) by.set(p.manager_id, []); by.get(p.manager_id).push(p); });
  const act = managers().filter((m) => m.active), missing = act.filter((m) => !by.has(m.id));
  main.innerHTML = `
    <div class="toolbar"><div class="row" style="flex-wrap:wrap"><h2>Unit photos</h2><input type="date" class="in" id="pd" value="${d}" max="${today}" style="width:auto"></div>
      <span class="muted">${by.size} of ${act.length} units photographed</span></div>
    ${missing.length ? `<div class="card pad" style="margin-bottom:16px"><h3 style="margin-bottom:8px">No photo yet</h3><div class="missing-list">${missing.map((m) => `<span class="chip red">${esc(titleCase(m.full_name))}</span>`).join("")}</div></div>` : ""}
    ${[...by.entries()].map(([mid, ps]) => { const m = S.profiles.find((p) => p.id === mid); return `<div class="photo-day"><div class="group-title"><h3>${esc(titleCase(m ? m.full_name : ""))} <span class="faint small">· ${esc(m?.department || "")}</span></h3><span class="faint small">${ps.length}</span></div><div class="photos">${ps.map((p) => `<button type="button" class="ph" data-photo="${esc(p.id)}" style="padding:0"><img src="${esc(p.url)}" alt="Unit photo" loading="lazy"><span class="cap">${esc(fmtTime(p.created_at))}</span></button>`).join("")}</div></div>`; }).join("") || `<div class="card"><p class="empty">No photos for this day.</p></div>`}`;
  $("#pd").onchange = async (e) => { if (!e.target.value) return; S.aPhotoDate = e.target.value; await loadAdminPhotos(); renderAdmin(); };
  main.querySelectorAll("[data-photo]").forEach((b) => b.onclick = () => photoLightbox(S.aPhotos.find((p) => p.id === b.dataset.photo)));
}

/* ---------- Managers admin ---------- */
const randomPin = () => String(Math.floor(100000 + Math.random() * 900000));
function renderManagersAdmin(main) {
  const list = managers();
  main.innerHTML = `
    <div class="toolbar"><h2>Managers</h2><button class="btn primary" type="button" id="addM">Add manager</button></div>
    <div class="card table-wrap"><table class="t">
      <thead><tr><th>Name</th><th>Department / unit</th><th>Tasks</th><th>Status</th><th></th></tr></thead>
      <tbody>${list.map((m) => `<tr>
        <td><b>${esc(titleCase(m.full_name))}</b></td>
        <td><input class="in" data-dept="${esc(m.id)}" value="${esc(m.department || "")}" placeholder="Set department" style="max-width:220px;padding:6px 10px"></td>
        <td class="muted">${S.tasks.filter((t) => t.manager_id === m.id && t.active).length} active</td>
        <td>${m.active ? `<span class="chip teal">Can sign in</span>` : `<span class="chip">Switched off</span>`}</td>
        <td class="num" style="white-space:nowrap"><button class="btn ghost" type="button" data-pin="${esc(m.id)}">New PIN</button><button class="btn ghost" type="button" data-act="${esc(m.id)}">${m.active ? "Switch off" : "Switch on"}</button></td></tr>`).join("")}</tbody>
    </table></div>
    <p class="faint small" style="margin-top:8px">Department changes save when you leave the box. Switching a manager off stops sign-in and hides them from reports; history is kept.</p>`;
  $("#addM").onclick = addManagerForm;
  main.querySelectorAll("[data-dept]").forEach((i) => i.onchange = async () => { await api.updateProfile(i.dataset.dept, { department: i.value.trim() || null }); S.profiles.find((p) => p.id === i.dataset.dept).department = i.value.trim() || null; toast("Department saved"); });
  main.querySelectorAll("[data-act]").forEach((b) => b.onclick = async () => {
    const m = S.profiles.find((p) => p.id === b.dataset.act);
    try { await api.manageManager({ action: "set_active", user_id: m.id, active: !m.active }); m.active = !m.active; renderAdmin(); toast(m.active ? "Switched on" : "Switched off"); } catch (e) { toast(e.message); }
  });
  main.querySelectorAll("[data-pin]").forEach((b) => b.onclick = async () => {
    const m = S.profiles.find((p) => p.id === b.dataset.pin), pin = randomPin();
    if (!(await ask(`Give ${titleCase(m.full_name)} a new PIN? The old PIN stops working.`, "Give new PIN", false))) return;
    try { await api.manageManager({ action: "reset_pin", user_id: m.id, pin }); pinShown(m.full_name, pin); } catch (e) { toast(e.message); }
  });
}
function pinShown(name, pin) {
  openSheet(`<h2>New PIN for ${esc(titleCase(name))}</h2><p class="muted">Tell the manager this PIN. It is shown only once.</p><p style="font-size:2.4rem;font-weight:700;letter-spacing:.3em;margin:16px 0">${esc(pin)}</p><div class="actions"><button class="btn primary" type="button" data-dismiss>Done</button></div>`);
}
function addManagerForm() {
  openSheet(`<h2>Add manager</h2>
    <div class="form-grid" style="margin-top:12px">
      <div class="full"><label class="f" for="mn">Full name</label><input id="mn" class="in" autofocus placeholder="e.g. SANJAY DAS"></div>
      <div class="full"><label class="f" for="md">Department / unit</label><input id="md" class="in" placeholder="e.g. Packing"></div>
    </div>
    <p class="err" id="mErr"></p>
    <div class="actions"><button class="btn" type="button" data-dismiss>Cancel</button><button class="btn primary" type="button" id="mSave">Add and create PIN</button></div>`);
  $("#mSave").onclick = async () => {
    const name = $("#mn").value.trim().toUpperCase(); if (!name) return ($("#mErr").textContent = "Enter the manager's name.");
    const pin = randomPin(); $("#mSave").disabled = true;
    try {
      await api.manageManager({ action: "create", full_name: name, department: $("#md").value.trim() || null, email: slugEmail(name), pin });
      S.profiles = await api.profiles(); managersCache = []; renderAdmin(); pinShown(name, pin);
    } catch (e) { $("#mErr").textContent = e.message; $("#mSave").disabled = false; }
  };
}

/* =========================================================================
   Boot
   ========================================================================= */
async function boot() {
  app.innerHTML = `<div class="spinner" aria-label="Loading"></div>`;
  try {
    if (!S.me) S.me = await api.me();
    if (!S.me) return renderLogin();
    if (S.me.role === "admin") { await loadAdmin(); renderAdmin(); }
    else { await loadManager(); renderManager(); }
  } catch (e) {
    app.innerHTML = `<main class="login"><div class="card"><h2>Something went wrong</h2><p class="muted" style="margin:8px 0 16px">${esc(e.message)}</p><button class="btn primary" type="button" onclick="location.reload()">Reload</button> <button class="btn" type="button" id="so">Sign out</button></div></main>`;
    $("#so").onclick = signOut;
  }
}
// Refresh the manager view when the phone comes back to the app (date may have rolled over)
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !S.me) return;
  if (S.me.role === "manager") { const t = istToday(); if (S.mDate > t || S.mDate < addDays(t, -CFG.BACKFILL_DAYS)) S.mDate = t; loadManager().then(renderManager).catch(() => {}); }
});
boot();
</script>
